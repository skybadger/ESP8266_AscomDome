; PlatformIO build for the same sketch that is opened directly by Arduino IDE.
; Keeping src_dir at the project root avoids maintaining a second source copy.
[platformio]
src_dir = .

[env:esp12e]
platform = espressif8266
board = esp12e
framework = arduino

board_build.f_cpu = 160000000L
monitor_speed = 115200
monitor_filters =
    ; Decode raw crash lines before timestamps or colour codes alter them.
    esp8266_exception_decoder
    time
    colorize
    log2file

; Only the root sketch is a compilation unit. Its local headers are included by
; the sketch; this also prevents files in build/, debug/, and .pio/ being built.
build_src_filter =
    +<*>
    -<build/>
    -<debug/>
    -<.pio/>
    -<tests/>

; Shared Arduino libraries used by this repository checkout.
lib_extra_dirs = ../libraries
upload_port = com22
monitor_port= com22

build_flags =
    ; Trace incoming HTTP requests, parsing and handler selection on serial.
;    -D DEBUG_ESP_PORT=Serial
;    -D DEBUG_ESP_HTTP_SERVER
    -Os 
    -I ../libraries/ASCOM_rest
    -I ../libraries/EEPROMAnything
    -I ../libraries/FRAM_FM24CXX_I2C
    -I ../libraries/RemoteDebug
